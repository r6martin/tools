<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src https://n8n.tritonai.ucsd.edu; img-src 'self' data:; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>MTL Camera Availability</title>
<style>
  :root {
    --bg: #f5f6f8; --ink: #1d2026; --muted: #6a7280; --line: #e3e6ea;
  --green: #4caf7d; --yellow: #d9a13d; --orange: #E85D04; --red: #d32f2f;
    --green-bg: #e2f2e8; --yellow-bg: #fbf0d7;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.45 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .wrap { max-width: 1160px; margin: 0 auto; padding: 24px 20px 48px; }
  header { align-items: baseline; gap: 6px 14px;
           margin-bottom: 6px; }
  h1 { font-size: 20px; margin: 0; }
  h2 { font-size: 14px; margin: 22px 0 10px; color: var(--ink); }
  .sub { color: var(--muted); font-size: 13px; }
  .off-hours-badge { display: none; background: #eceef1; color: #6a7280;
    font-size: 11px; padding: 2px 8px; border-radius: 10px;
    border: 1px solid var(--line); margin-left: 6px; vertical-align: 1px; }
  .legend { display: flex; flex-wrap: wrap; gap: 10px; margin: 12px 0 4px;
            font-size: 12px; color: var(--muted); }
  .legend .chip { display: inline-block; width: 12px; height: 12px;
                  border-radius: 3px; margin-right: 5px; vertical-align: -1px;
                  border: 1px solid var(--line); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
          gap: 12px; }
  .tile { border-radius: 8px; padding: 14px 16px 0; border: 1px solid var(--line);
          display: flex; flex-direction: column; gap: 2px; min-height: 104px;
          overflow: hidden; }
  .tile.green  { background: var(--green-bg); }
  .tile.yellow { background: var(--yellow-bg); }
  .tile.orange { background: #E85D04; border-color: #E85D04; color: #fff; }
  .tile.red    { background: #d32f2f; border-color: #d32f2f; color: #fff; }
  .type { font-size: 14px; font-weight: 600; line-height: 1.25;
          min-height: 35px;
          display: -webkit-box; -webkit-box-orient: vertical;
          -webkit-line-clamp: 2; overflow: hidden; }
  .count { font-size: 26px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .count span { font-size: 15px; font-weight: 500; color: var(--muted); }
  .tile.orange .count span, .tile.red .count span { color: rgba(255, 255, 255, 0.75); }
  .lookahead-label { font-size: 12px; color: var(--muted); margin: 2px 0 8px; }
  .lookahead-label b { color: var(--ink); font-weight: 600; }
  .tile.orange .lookahead-label, .tile.red .lookahead-label { color: rgba(255, 255, 255, 0.85); }
  .tile.orange .lookahead-label b, .tile.red .lookahead-label b { color: #fff; }
  .lookahead { background: var(--line); height: 14px; position: relative;
               margin: auto -16px 0;
               border-top: 1px solid rgba(0, 0, 0, 0.18); }
  .lookahead .fill { position: absolute; inset: 0 auto 0 0; }
  .lookahead .fill.green  { background: var(--green); }
  .lookahead .fill.yellow { background: var(--yellow); }
  .lookahead .fill.orange { background: #c35400; }
  .lookahead .fill.red    { background: #8e1616; }
  .banner { display: none; margin: 10px 0 4px; padding: 8px 12px; border-radius: 6px;
            background: var(--yellow-bg); border: 1px solid var(--yellow); font-size: 13px; }
  .banner.show { display: block; }
  .foot { margin-top: 20px; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1 id="title"></h1>
  <div class="sub" id="subtitle"></div>
  <span class="off-hours-badge" id="off-hours-badge">off-hours · updates hourly</span>
</header>
<div class="banner" id="banner" role="status" aria-live="polite"></div>
<div class="legend">
  <span><span class="chip" style="background: var(--green-bg); border-color: var(--green);"></span><span id="lg-green"></span></span>
  <span><span class="chip" style="background: var(--yellow-bg); border-color: var(--yellow);"></span><span id="lg-yellow"></span></span>
  <span><span class="chip" style="background: var(--orange); border-color: var(--orange);"></span><span id="lg-orange"></span></span>
  <span><span class="chip" style="background: var(--red); border-color: var(--red);"></span><span id="lg-red"></span></span>
</div>
<div id="sections"></div>
<div class="foot" id="foot"></div>
</div>
<script src="app.js"></script>
</body>
</html>
